<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Préstamo — Nomify</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <style>
    @media print {
      .sidebar, .topbar, #btn-print { display: none !important; }
      .main { margin-left: 0 !important; }
      body { background: #fff !important; }
      .content { padding: 8px !important; }
      .card { background: #f2f2f2 !important; border-color: #ccc !important; }
      .card .value, .card .label { color: #111 !important; }
      table thead th { background: #eee !important; color: #000 !important; }
      table tbody td { color: #333 !important; background: transparent !important; }
    }
    .progress-bar-track {
      background: var(--navy2);
      border-radius: 4px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--green2);
      height: 100%;
      border-radius: 4px;
      transition: width .4s ease;
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><h2>Nomify</h2></div>
    <nav>
      <a href="/index.html"><span class="icon">📊</span> Dashboard</a>
      <a href="/empleados.html"><span class="icon">👥</span> Empleados</a>
      <a href="/planillas.html"><span class="icon">📋</span> Planillas</a>
      <a href="/prestamos.html" class="active"><span class="icon">💰</span> Préstamos</a>
      <a href="/adelantos.html"><span class="icon">⚡</span> Adelantos</a>
      <a href="/extras.html"><span class="icon">⭐</span> Extras</a>
      <a href="/deducciones.html"><span class="icon">➖</span> Otras Deducciones</a>
      <a href="/calendario.html"><span class="icon">📅</span> Calendario</a>
      <a href="/vacaciones.html"><span class="icon">🏖</span> Vacaciones</a>
      <a href="/usuarios.html" id="link-usuarios"><span class="icon">👤</span> Usuarios</a>
    </nav>
    <div class="sidebar-footer">
      <span id="user-email"></span>
      <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="titulo-prestamo">Detalle del Préstamo</h1>
        <span class="sub" id="sub-prestamo">Cargando...</span>
      </div>
      <div style="display:flex;gap:8px">
        <a href="/prestamos.html" class="btn btn-ghost btn-sm">← Volver</a>
        <button class="btn btn-ghost btn-sm" id="btn-print" onclick="window.print()">🖨 Imprimir</button>
      </div>
    </div>

    <div class="content">
      <div id="alert-det" class="alert"></div>

      <!-- Cards resumen -->
      <div class="cards" id="resumen-cards" style="margin-bottom:24px"></div>

      <!-- Barra de progreso -->
      <div style="margin-bottom:24px;background:var(--card);border-radius:10px;padding:16px 20px;border:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
          <span style="color:var(--text-muted)">Progreso del pago</span>
          <strong id="pct-label">0%</strong>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">
          <span id="info-pagado">C$ 0 pagado</span>
          <span id="info-saldo">C$ 0 pendiente</span>
        </div>
      </div>

      <!-- Historial de pagos -->
      <div class="table-wrap">
        <div class="table-header"><h3>Historial de pagos</h3></div>
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Monto</th>
              <th>Tipo</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody id="tabla-pagos">
            <tr class="loading-row"><td colspan="4"><div class="spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script>
const _p = new URLSearchParams(window.location.search);
const prestamoId = _p.get('id') || '';

onReady(['Master', 'Planillero'], () => {
  initLayout();
  if (!prestamoId) {
    showAlert('alert-det', 'No se especificó un ID de préstamo', 'error');
    return;
  }
  loadDetalle();
});

async function loadDetalle() {
  try {
    const [prestamo, pagos] = await Promise.all([
      apiFetch(`/api/prestamos/${prestamoId}`),
      apiFetch(`/api/prestamos/${prestamoId}/pagos`),
    ]);

    // Título
    document.getElementById('titulo-prestamo').textContent = `Préstamo — ${prestamo.Empleado || '—'}`;
    const estado = prestamo.Estado || 'Activo';
    const frecuencia = prestamo.Frecuencia || 'Quincenal';
    const freDia = frecuencia === 'Mensual'
      ? ` · Día ${prestamo.Frecuencia_Dia === 'Fin' ? 'último' : prestamo.Frecuencia_Dia}`
      : '';
    document.getElementById('sub-prestamo').textContent = `${estado} · ${frecuencia}${freDia}`;

    const montoTotal  = parseFloat(prestamo['Monto total'] || 0);
    const saldo       = parseFloat(prestamo['Saldo pendiente'] || 0);
    const totalPagado = Math.max(0, Math.round((montoTotal - saldo) * 100) / 100);
    const cuota       = parseFloat(prestamo['Cuota quincenal'] || 0);
    const cuotasRest  = prestamo['Cuotas restantes'] || 0;
    const pct         = montoTotal > 0 ? Math.min(100, Math.round(totalPagado / montoTotal * 100)) : 0;

    // Cards
    document.getElementById('resumen-cards').innerHTML = `
      <div class="card"><div class="label">Monto original</div><div class="value" style="font-size:18px">${fmt(montoTotal)}</div></div>
      <div class="card"><div class="label">Total pagado</div><div class="value green" style="font-size:18px">${fmt(totalPagado)}</div></div>
      <div class="card"><div class="label">Saldo pendiente</div><div class="value" style="font-size:18px;color:var(--orange)">${fmt(saldo)}</div></div>
      <div class="card"><div class="label">Cuota / Cuotas restantes</div><div class="value" style="font-size:16px">${fmt(cuota)} <span style="font-size:13px;color:var(--muted)">· ${cuotasRest} cuotas</span></div></div>
    `;

    // Barra de progreso
    document.getElementById('pct-label').textContent = `${pct}%`;
    document.getElementById('progress-fill').style.width = `${pct}%`;
    document.getElementById('info-pagado').textContent = `${fmt(totalPagado)} pagado`;
    document.getElementById('info-saldo').textContent = `${fmt(saldo)} pendiente`;

    // Tabla pagos
    const tbody = document.getElementById('tabla-pagos');
    if (!pagos.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No hay pagos registrados aún</td></tr>';
    } else {
      tbody.innerHTML = pagos.map(pg => {
        const esDirecto = (pg.tipo || '').toLowerCase().includes('directo');
        return `<tr>
          <td>${pg.fecha || '—'}</td>
          <td class="num"><strong>${fmt(pg.monto)}</strong></td>
          <td><span class="badge ${esDirecto ? 'badge-blue' : 'badge-gray'}">${esDirecto ? 'Pago directo' : 'Quincena'}</span></td>
          <td style="color:var(--text-muted);font-size:12px">${pg.concepto || ''}</td>
        </tr>`;
      }).join('');
    }

  } catch (e) {
    showAlert('alert-det', 'Error: ' + e.message, 'error');
  }
}
</script>
</body>
</html>
