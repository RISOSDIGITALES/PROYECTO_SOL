<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Nomify</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="logo">
        <h1>Nomify</h1>
        <p>Sistema de planilla</p>
      </div>
      <div id="alert-login" class="alert"></div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <input type="email" id="inp-email" placeholder="Correo electrónico"
          style="padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:14px;width:100%;box-sizing:border-box;" />
        <div style="position:relative">
          <input type="password" id="inp-password" placeholder="Contraseña"
            style="padding:10px 40px 10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:14px;width:100%;box-sizing:border-box;" />
          <button type="button" id="btn-toggle-pass" tabindex="-1"
            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;padding:0;line-height:1">👁</button>
        </div>
        <button class="btn btn-primary" id="btn-login" style="width:100%;justify-content:center;font-size:15px;padding:12px;">
          Iniciar sesión
        </button>
      </div>
      <p style="text-align:center;margin-top:12px;font-size:12px;">
        <a id="link-forgot" href="#" style="color:var(--text-muted);text-decoration:none;">¿Olvidaste tu contraseña?</a>
      </p>

      <!-- Formulario de recuperación (oculto por defecto) -->
      <div id="panel-forgot" style="display:none;margin-top:8px;display:none;flex-direction:column;gap:10px">
        <p style="margin:0;font-size:13px;color:var(--text-muted);text-align:center">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
        <div id="alert-forgot" class="alert"></div>
        <input type="email" id="inp-forgot-email" placeholder="Tu correo electrónico"
          style="padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:14px;" />
        <button class="btn btn-primary" id="btn-forgot-send" style="width:100%;justify-content:center;font-size:14px;padding:11px;">
          Enviar enlace de recuperación
        </button>
        <p style="text-align:center;margin:0;font-size:12px;">
          <a id="link-back-login" href="#" style="color:var(--text-muted);text-decoration:none;">← Volver al inicio de sesión</a>
        </p>
      </div>

      <p style="text-align:center;margin-top:10px;font-size:12px;color:var(--muted);">
        Solo personal autorizado
      </p>
    </div>
  </div>

  <script>
    if (localStorage.getItem('planilla_token')) {
      const _u = JSON.parse(localStorage.getItem('planilla_user') || '{}');
      window.location.href = _u.rol === 'Empleado' ? '/mi-recibo.html' : '/index.html';
    }

    async function login() {
      const email = document.getElementById('inp-email').value.trim();
      const password = document.getElementById('inp-password').value;
      const alertEl = document.getElementById('alert-login');
      const btn = document.getElementById('btn-login');

      if (!email || !password) {
        alertEl.className = 'alert alert-error show';
        alertEl.textContent = 'Ingresa correo y contraseña';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error de autenticación');

        localStorage.setItem('planilla_token', data.token);
        localStorage.setItem('planilla_user', JSON.stringify({ email: data.email, rol: data.rol, nombre: data.nombre }));

        if (data.rol === 'Empleado') {
          window.location.href = '/mi-recibo.html';
        } else {
          window.location.href = '/index.html';
        }
      } catch (e) {
        alertEl.className = 'alert alert-error show';
        alertEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    }

    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('inp-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
    document.getElementById('btn-toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('inp-password');
      const btn = document.getElementById('btn-toggle-pass');
      if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
      else { inp.type = 'password'; btn.textContent = '👁'; }
    });

    // ── Recuperación de contraseña ───────────────────────────────────────────
    const panelLogin  = document.querySelector('.login-box > div[style]');   // form principal
    const panelForgot = document.getElementById('panel-forgot');
    const alertForgot = document.getElementById('alert-forgot');

    function mostrarForgot() {
      document.getElementById('alert-login').className = 'alert';
      document.getElementById('btn-login').closest('div[style]').style.display = 'none';
      document.querySelector('#link-forgot').style.display = 'none';
      panelForgot.style.display = 'flex';
      document.getElementById('inp-forgot-email').value = document.getElementById('inp-email').value || '';
      alertForgot.className = 'alert';
    }
    function mostrarLogin() {
      document.getElementById('btn-login').closest('div[style]').style.display = '';
      document.querySelector('#link-forgot').style.display = '';
      panelForgot.style.display = 'none';
    }

    document.getElementById('link-forgot').addEventListener('click', e => { e.preventDefault(); mostrarForgot(); });
    document.getElementById('link-back-login').addEventListener('click', e => { e.preventDefault(); mostrarLogin(); });

    document.getElementById('btn-forgot-send').addEventListener('click', async () => {
      const email = document.getElementById('inp-forgot-email').value.trim();
      if (!email) {
        alertForgot.className = 'alert alert-error show';
        alertForgot.textContent = 'Ingresa tu correo electrónico';
        return;
      }
      const btn = document.getElementById('btn-forgot-send');
      btn.disabled = true; btn.textContent = 'Enviando...';
      try {
        await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        alertForgot.className = 'alert alert-success show';
        alertForgot.textContent = '✅ Si ese correo existe, recibirás el enlace en breve. Revisá tu bandeja de entrada.';
        btn.textContent = 'Enviado ✓';
      } catch (e) {
        alertForgot.className = 'alert alert-error show';
        alertForgot.textContent = 'Error al enviar. Intenta de nuevo.';
        btn.disabled = false; btn.textContent = 'Enviar enlace de recuperación';
      }
    });
  </script>
</body>
</html>
