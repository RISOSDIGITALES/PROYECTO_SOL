<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Planilla Nicaragua</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="logo">
        <h1>🧮 PLANILLA</h1>
        <p>NICARAGUA — RISOS DIGITALES</p>
      </div>
      <div id="alert-login" class="alert"></div>
      <button class="btn btn-primary" id="btn-login" style="width:100%;justify-content:center;font-size:15px;padding:12px;">
        Iniciar sesión
      </button>
      <p style="text-align:center;margin-top:14px;font-size:12px;color:var(--muted);">
        Solo personal autorizado
      </p>
    </div>
  </div>

  <script>
    const identity = window.netlifyIdentity;
    identity.init();

    // If already logged in, redirect
    identity.on('init', user => {
      if (user) window.location.href = '/index.html';
    });

    identity.on('login', () => {
      window.location.href = '/index.html';
    });

    identity.on('error', err => {
      const el = document.getElementById('alert-login');
      el.className = 'alert alert-error show';
      el.textContent = err.message || 'Error de autenticación';
    });

    document.getElementById('btn-login').addEventListener('click', () => {
      identity.open('login');
    });
  </script>
</body>
</html>
