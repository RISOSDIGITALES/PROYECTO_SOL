<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- El ?v=2 es a propósito, no cosmético -- Chrome cachea el favicon por
         separado del resto de la caché de la página, y sobrevive incluso a
         un hard refresh (Ctrl+F5) mientras la URL del archivo no cambie.
         Confirmado en vivo el 2026-09-18: el archivo real ya servía el
         ícono correcto (200, contenido verificado), pero el navegador de la
         usuaria seguía mostrando el rayo default de Vite de antes del
         reemplazo -- cambiar la URL fuerza que Chrome lo trate como un
         recurso nunca visto y lo pida de nuevo, sin depender de que alguien
         limpie caché a mano. Si se vuelve a reemplazar este archivo en el
         futuro, subir este número de nuevo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Bubble 54 (nombre provisorio) — Growth54</title>
  </head>

  </body>
</html>
