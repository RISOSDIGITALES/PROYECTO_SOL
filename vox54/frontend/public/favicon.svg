<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#1E45D6"/>
    </linearGradient>
    <radialGradient id="glass" cx="30%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>
    <!-- Brillo real de burbuja, mismo patron que .vox54-amb en theme.css:
         un punto blanco chico y nitido arriba a la izquierda que se apaga
         rapido, separado del degradado de volumen (glass) de arriba.
         cx/cy/r en porcentaje con objectBoundingBox (el default de SVG)
         para que se acomode solo al tamaño real de cada burbuja donde se
         use, sin tener que calcular coordenadas distintas para cada una. -->
    <radialGradient id="shine" cx="30%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mismo lenguaje visual que el resto de Bubble 54: fondo con el
       degradado azul real (.g54-badge / TopBrandBar) y burbujas de vidrio
       (mismo radial-gradient translucido) en vez de un icono sin relacion
       con el producto.

       Decisión explícita de la usuaria (2026-09-18): sin ninguna letra
       adentro de las burbujas: se probaron dos caminos distintos (texto
       con la fuente embebida, y despues los contornos reales convertidos
       a paths) y en el tamaño real del icono de la pestaña ninguno de los
       dos se veía bien: a ese tamaño tan chico el "54"/"B" queda ilegible
       y ensucia mas de lo que suma. Las burbujas solas, sin texto, es el
       diseño final aprobado.

       OJO: un comentario XML nunca puede contener dos guiones seguidos en
       el cuerpo, solo en la apertura y el cierre. Un doble guion acá (por
       ejemplo usado como raya de más) rompe el parseo real de este archivo
       como SVG/XML. Revisar con cuidado antes de tocar este comentario. -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="25" cy="38" r="17" fill="url(#glass)" stroke="rgba(255,255,255,0.6)" stroke-width="0.2"/>
  <circle cx="25" cy="38" r="17" fill="url(#shine)"/>
  <circle cx="45" cy="20" r="9" fill="url(#glass)" stroke="rgba(255,255,255,0.6)" stroke-width="0.2"/>
  <circle cx="45" cy="20" r="9" fill="url(#shine)"/>
  <circle cx="46" cy="46" r="6" fill="url(#glass)" stroke="rgba(255,255,255,0.6)" stroke-width="0.2"/>
  <circle cx="46" cy="46" r="6" fill="url(#shine)"/>
</svg>
