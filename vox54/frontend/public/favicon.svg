<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-weight: 700;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#1E45D6"/>
    </linearGradient>
    <radialGradient id="glass" cx="30%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>
    <!-- Brillo real de burbuja, mismo patron que .vox54-amb en theme.css:
         un punto blanco chico y nitido arriba a la izquierda que se apaga
         rapido, separado del degradado de volumen (glass) de arriba.
         cx/cy/r en porcentaje con objectBoundingBox (el default de SVG)
         para que se acomode solo al tamaño real de cada burbuja donde se
         use, sin tener que calcular coordenadas distintas para cada una. -->
    <radialGradient id="shine" cx="30%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mismo lenguaje visual que el resto de Bubble 54: fondo con el
       degradado azul real (.g54-badge / TopBrandBar) y burbujas de vidrio
       (mismo radial-gradient translúcido) en vez de un ícono sin relación
       con el producto.

       El '54'/'B' usan la tipografía real de marca (Fredoka 700, igual que
       .g54-badge en theme.css), embebida acá como woff2 en base64 y
       recortada a solo los 3 caracteres que hacen falta (4, 5, B) para que
       pese casi nada (~1KB): un favicon se renderiza fuera del contexto
       de la página, sin sus fuentes web cargadas, así que depender de que
       Fredoka ya esté disponible por el <link> de index.html no funciona
       ahí: hay que traerla con el propio archivo.

       OJO: un comentario XML nunca puede contener dos guiones seguidos en
       el cuerpo, solo en la apertura y el cierre. Un doble guion acá (por
       ejemplo usado como raya de más) rompe el parseo real de este archivo
       como SVG/XML. Confirmado en vivo el 2026-09-18: navegar directo a
       este archivo mostraba un error real de parseo en vez del ícono; esa
       era la causa real de que el favicon nunca se viera actualizado, no
       la caché del navegador. Revisar con cuidado antes de tocar este
       comentario de nuevo. -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="25" cy="38" r="17" fill="url(#glass)" stroke="rgba(255,255,255,0.75)" stroke-width="0.5"/>
  <circle cx="25" cy="38" r="17" fill="url(#shine)"/>
  <text x="25" y="39" text-anchor="middle" dominant-baseline="central" font-family="Fredoka" font-weight="700" font-size="28" letter-spacing="-1.4" fill="#1E45D6">54</text>
  <circle cx="45" cy="20" r="9" fill="url(#glass)" stroke="rgba(255,255,255,0.75)" stroke-width="0.5"/>
  <circle cx="45" cy="20" r="9" fill="url(#shine)"/>
  <text x="45" y="21" text-anchor="middle" dominant-baseline="central" font-family="Fredoka" font-weight="700" font-size="17" fill="#ffffff">B</text>
  <circle cx="46" cy="46" r="6" fill="url(#glass)" stroke="rgba(255,255,255,0.75)" stroke-width="0.5"/>
  <circle cx="46" cy="46" r="6" fill="url(#shine)"/>
</svg>
