<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#1E45D6"/>
    </linearGradient>
    <radialGradient id="glass" cx="30%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- Mismo lenguaje visual que el resto de Bubble 54 -- fondo con el
       degradado azul real (.g54-badge / TopBrandBar) y burbujas de vidrio
       (mismo radial-gradient translúcido) en vez de un ícono sin relación
       con el producto. -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="25" cy="38" r="17" fill="url(#glass)"/>
  <circle cx="45" cy="20" r="9" fill="url(#glass)"/>
  <circle cx="46" cy="46" r="6" fill="url(#glass)"/>
</svg>
