  </g>
  <circle cx="45" cy="20" r="9" fill="url(#glass)" stroke="rgba(255,255,255,0.6)" stroke-width="0.2"/>
  <circle cx="45" cy="20" r="9" fill="url(#shine)"/>
  <g transform="translate(39.7385,25.814) scale(0.017,-0.017)" fill="#ffffff">
    <path d="M121 -8Q76 -8 57.0 5.5Q38 19 34.0 40.5Q30 62 30 85V601Q30 623 34.0 644.0Q38 665 57.0 678.5Q76 692 122 692H356Q417 692 465.0 662.5Q513 633 541.0 584.0Q569 535 569 478Q569 459 565.5 439.5Q562 420 554.5 401.5Q547 383 536 366Q553 345 565.0 320.5Q577 296 583.0 270.5Q589 245 589 219Q588 171 570.5 129.5Q553 88 522.0 57.5Q491 27 451.0 9.5Q411 -8 366 -8ZM213 175H356Q363 175 375.0 177.5Q387 180 396.5 191.5Q406 203 406 230Q406 244 403.5 253.5Q401 263 396.0 268.5Q391 274 384.5 276.5Q378 279 369.5 280.0Q361 281 351 281H338Q298 281 281.0 298.0Q264 315 264 358Q264 399 282.5 415.5Q301 432 343 432H355Q363 432 369.0 433.0Q375 434 378.5 438.0Q382 442 384.0 449.5Q386 457 386 470Q386 493 375.5 501.0Q365 509 334 509H213Z"/>
  </g>
  <circle cx="46" cy="46" r="6" fill="url(#glass)" stroke="rgba(255,255,255,0.6)" stroke-width="0.2"/>
  <circle cx="46" cy="46" r="6" fill="url(#shine)"/>
</svg>
