<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#1E45D6"/>
    </linearGradient>
    <radialGradient id="glass" cx="30%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>
    <!-- Brillo real de burbuja, mismo patron que .vox54-amb en theme.css:
         un punto blanco chico y nitido arriba a la izquierda que se apaga
         rapido, separado del degradado de volumen (glass) de arriba.
         cx/cy/r en porcentaje con objectBoundingBox (el default de SVG)
         para que se acomode solo al tamaño real de cada burbuja donde se
         use, sin tener que calcular coordenadas distintas para cada una. -->
    <radialGradient id="shine" cx="30%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Version "con letras" del favicon de Bubble 54, guardada aparte a
       pedido explicito de la usuaria (2026-09-18) para un posible uso
       futuro como logo en miniatura (donde SI se ve bien un tamaño mas
       grande, a diferencia del icono real de la pestaña del navegador,
       que renderiza demasiado chico para que el texto se lea).

       El favicon.svg real de la app (vox54/frontend/public/favicon.svg)
       quedo sin texto, solo las 3 burbujas: decision final tras probar
       esta misma version ahi y confirmar que a tamaño de pestaña el "54"
       y la "B" quedan ilegibles.

       El '54'/'B' son los contornos reales de Fredoka Bold (la misma
       tipografia de .g54-badge) convertidos a paths con fontTools a
       partir del woff2 recortado que el favicon tenia embebido: no
       dependen de que ninguna fuente cargue en tiempo real, por eso se
       ven igual en cualquier contexto (a diferencia del <text> con
       @font-face que se probo primero, que fallaba en el icono real de
       la pestaña aunque funcionaba al abrir el archivo como pagina).

       OJO: un comentario XML nunca puede contener dos guiones seguidos en
       el cuerpo, solo en la apertura y el cierre. Un doble guion aca (por
       ejemplo usado como raya de mas) rompe el parseo real de este
       archivo como SVG/XML. Revisar con cuidado antes de tocar este
       comentario. -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="25" cy="38" r="17" fill="url(#glass)" stroke="rgba(255,255,255,0.6)" stroke-width="0.2"/>
  <circle cx="25" cy="38" r="17" fill="url(#shine)"/>
  <g transform="translate(11.406,47.4117) scale(0.028,-0.028)" fill="#1E45D6">
