<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recibo de Pago — Nomify</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <style>
    .recibo-wrap {
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      color: #222;
      border: 1px solid #ccc;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    .recibo-header {
      background: #2c3e50;
      color: #fff;
      text-align: center;
      padding: 14px 12px 10px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .recibo-header span {
      display: block;
      font-size: 12px;
      font-weight: normal;
      color: #fff;
      margin-top: 3px;
    }
    .recibo-section { border-bottom: 1px solid #d8d8d8; }
    .recibo-section-title {
      background: #eaeaea;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #333;
      border-bottom: 1px solid #d8d8d8;
    }
    .recibo-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 14px;
      border-bottom: 1px solid #efefef;
    }
    .recibo-row:last-child { border-bottom: none; }
    .recibo-row .label { color: #444; }
    .recibo-row .value { font-weight: 600; text-align: right; color: #111; }
    .recibo-row.subtotal { background: #f5f5f5; font-weight: 700; }
    .recibo-row.neto {
      background: #2c3e50;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
    }
    .recibo-row.neto .label,
    .recibo-row.neto .value { color: #fff; }
    .recibo-row.descuento .value { color: #333; }
    .firma-area {
      padding: 20px 14px 16px;
      font-size: 12px;
      color: #444;
    }
    .firma-area .linea {
      border-top: 1px solid #333;
      margin-top: 32px;
      width: 180px;
      text-align: center;
      font-size: 11px;
      padding-top: 4px;
      color: #555;
    }
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { margin: 0; padding: 0; background: #fff !important; }
      .sidebar, .topbar, #btn-volver, #btn-print { display: none !important; }
      .layout { display: block !important; }
      .main  { margin: 0 !important; padding: 0 !important; width: 100% !important; }
      .content { padding: 0 !important; margin: 0 !important; }
      .recibo-wrap {
        max-width: 100% !important;
        border: none !important;
        margin: 0 !important;
        box-shadow: none !important;
      }
      .recibo-section-title { font-weight: 800 !important; color: #000 !important; }
      .recibo-row .label { color: #222 !important; }
      .recibo-row .value { color: #000 !important; }
      .firma-area { color: #333 !important; }
      .recibo-row.neto { background: #111 !important; }
      .recibo-row.neto .label,
      .recibo-row.neto .value { color: #fff !important; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><h2>Nomify</h2></div>
    <nav id="sidebar-nav">
      <!-- se adapta según el rol: admin ve todo, empleado solo Mi Portal -->
      <a href="/index.html" class="nav-admin"><span class="icon">📊</span> Dashboard</a>
      <a href="/empleados.html" class="nav-admin"><span class="icon">👥</span> Empleados</a>
      <a href="/planillas.html" class="nav-admin active"><span class="icon">📋</span> Planillas</a>
      <a href="/prestamos.html" class="nav-admin"><span class="icon">💰</span> Préstamos</a>
      <a href="/adelantos.html" class="nav-admin"><span class="icon">⚡</span> Adelantos</a>
      <a href="/extras.html" class="nav-admin"><span class="icon">⭐</span> Extras</a>
      <a href="/deducciones.html" class="nav-admin"><span class="icon">➖</span> Otras Deducciones</a>
      <a href="/calendario.html" class="nav-admin"><span class="icon">📅</span> Calendario</a>
      <a href="/vacaciones.html" class="nav-admin"><span class="icon">🏖</span> Vacaciones</a>
      <a href="/usuarios.html" id="link-usuarios" class="nav-admin"><span class="icon">👤</span> Usuarios</a>
      <a href="/mi-recibo.html" class="nav-empleado" style="display:none"><span class="icon">📋</span> Mi Portal</a>
    </nav>
    <div class="sidebar-footer">
      <span id="user-email"></span>
      <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Recibo de Pago</h1>
        <span class="sub" id="sub-recibo">Cargando...</span>
      </div>
      <div style="display:flex;gap:8px">
        <a id="btn-volver" href="/planilla-detalle.html" class="btn btn-ghost btn-sm">← Volver</a>
        <button class="btn btn-ghost btn-sm" id="btn-email-recibo">📧 Enviar por correo</button>
        <button class="btn btn-ghost btn-sm" id="btn-descargar-recibo">⬇ Descargar PDF</button>
        <button class="btn btn-sm" onclick="window.print()" style="background:var(--green);color:#fff">🖨 Imprimir</button>
      </div>
    </div>

    <div class="content">
      <div id="alert-recibo" class="alert"></div>
      <div id="recibo-container">
        <div style="text-align:center;padding:40px"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Enviar recibo por correo -->
<div class="overlay" id="modal-email-recibo">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3>📧 Enviar recibo por correo</h3>
      <button class="modal-close" id="close-email-recibo">×</button>
    </div>
    <div class="modal-body">
      <div id="alert-email-recibo" class="alert"></div>
      <p style="margin:0 0 14px;font-size:13px;color:var(--text-muted)">Se generará un PDF del recibo de pago y se enviará al correo indicado.</p>
      <label style="display:block;font-size:13px;margin-bottom:6px;color:var(--text-muted)">Correo destinatario</label>
      <input type="email" id="inp-email-recibo" placeholder="ejemplo@correo.com"
        style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:14px;" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancel-email-recibo">Cancelar</button>
      <button class="btn btn-primary" id="btn-send-recibo">Enviar PDF</button>
    </div>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script>
onReady(['Master', 'Planillero', 'Empleado'], async () => {
  initLayout();
  const p = new URLSearchParams(window.location.search);
  const empleadoId = p.get('empleado_id') || '';
  const periodo    = p.get('periodo')      || '';
  document.getElementById('sub-recibo').textContent = `Período ${fmtPeriodo(periodo)}`;

  // Adaptar sidebar y botón volver según rol
  const myInfo = await getMyInfo();
  if (myInfo.rol === 'Empleado') {
    // Ocultar enlaces de admin, mostrar solo Mi Portal
    document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.nav-empleado').forEach(el => el.style.display = '');
    document.getElementById('btn-volver').href = '/mi-recibo.html';
    document.getElementById('btn-volver').textContent = '← Mi Portal';
  } else {
    const volverUrl = `/planilla-detalle.html?periodo=${encodeURIComponent(periodo)}`;
    document.getElementById('btn-volver').href = volverUrl;
  }

  loadRecibo(empleadoId, periodo);
});

function cs(n) {
  if (!n && n !== 0) return '—';
  return 'C$ ' + parseFloat(n).toLocaleString('es-NI', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fd(s) {
  if (!s) return '—';
  return s.split('T')[0];
}

async function loadRecibo(empleadoId, periodo) {
  try {
    const qs = `?empleado_id=${encodeURIComponent(empleadoId)}&periodo=${encodeURIComponent(periodo)}`;
    const data = await apiFetch('/api/recibo' + qs);
    renderRecibo(data, periodo);
    // Pre-llenar el input de email con el del empleado si está disponible
    const emailEmp = data.empleado?.email || '';
    if (emailEmp) document.getElementById('inp-email-recibo').value = emailEmp;
  } catch (e) {
    showAlert('alert-recibo', 'Error cargando recibo: ' + e.message, 'error');
    document.getElementById('recibo-container').innerHTML = '';
  }
}

function renderRecibo(data, periodo) {
  const periodoDisplay = fmtPeriodo(periodo);

  const emp  = data.empleado    || {};
  const det  = data.detalle     || {};
  const adel = data.adelantos   || [];
  const ext  = data.extras      || [];
  const ded  = data.deducciones || [];
  const vac  = data.vacaciones  || [];

  const salarioMensual   = parseFloat(emp.salario_bruto || 0);
  const subTotalQuincena = parseFloat(det.salario_quincenal || salarioMensual / 2);

  const bonosArr    = ext.filter(e => e.tipo === 'Bono');
  const feriadosArr = ext.filter(e => e.tipo === 'Feriado trabajado');
  const turnosArr   = ext.filter(e => e.tipo === 'Otro');
  const bono        = bonosArr.reduce((s, e) => s + parseFloat(e.monto || 0), 0);
  const feriados    = feriadosArr.reduce((s, e) => s + parseFloat(e.monto || 0), 0);
  const turnoExt    = turnosArr.reduce((s, e) => s + parseFloat(e.monto || 0), 0);
  const vacPago     = vac.reduce((s, v) => s + parseFloat(v.monto || 0), 0);
  const granTotal   = subTotalQuincena + bono + feriados + turnoExt + vacPago;

  const inss         = parseFloat(det.inss || 0);
  const ir           = parseFloat(det.ir || 0);
  const descPrestamo = parseFloat(det.desc_prestamo || 0);
  const descAdelanto = parseFloat(det.desc_adelanto || 0);
  const descDed      = ded.reduce((s, d) => s + parseFloat(d.monto || 0), 0);
  const totalDesc    = inss + ir + descAdelanto + descDed + descPrestamo;
  const netoAPagar   = parseFloat(det.neto || (granTotal - totalDesc));

  const extrasSection = (bono || feriados || turnoExt || vacPago) ? `
    <div class="recibo-section">
      <div class="recibo-section-title">Extras</div>
      ${bono ? `<div class="recibo-row"><span class="label">Bono</span><span class="value">${cs(bono)}</span></div>` : ''}
      ${feriados ? `<div class="recibo-row"><span class="label">Feriados trabajados</span><span class="value">${cs(feriados)}</span></div>` : ''}
      ${turnoExt ? `<div class="recibo-row"><span class="label">Turno / Extra</span><span class="value">${cs(turnoExt)}</span></div>` : ''}
      ${vac.map(v => `<div class="recibo-row"><span class="label">Vacaciones pagadas (${v.dias} días)</span><span class="value">${cs(parseFloat(v.monto || 0))}</span></div>`).join('')}
    </div>` : '';

  let filasDesc = '';
  if (inss > 0) filasDesc += `<div class="recibo-row descuento"><span class="label">INSS Laboral (7%)</span><span class="value">- ${cs(inss)}</span></div>`;
  if (ir > 0)   filasDesc += `<div class="recibo-row descuento"><span class="label">IR</span><span class="value">- ${cs(ir)}</span></div>`;
  if (adel.length > 0) {
    adel.forEach(a => {
      filasDesc += `<div class="recibo-row descuento"><span class="label">Adelanto</span><span class="value">- ${cs(parseFloat(a.monto || 0))}</span></div>`;
    });
  } else if (descAdelanto > 0) {
    filasDesc += `<div class="recibo-row descuento"><span class="label">Adelanto</span><span class="value">- ${cs(descAdelanto)}</span></div>`;
  }
  ded.forEach(d => {
    filasDesc += `<div class="recibo-row descuento"><span class="label">${d.concepto || 'Deducción'}</span><span class="value">- ${cs(parseFloat(d.monto || 0))}</span></div>`;
  });
  if (descPrestamo > 0) filasDesc += `<div class="recibo-row descuento"><span class="label">Abono préstamo</span><span class="value">- ${cs(descPrestamo)}</span></div>`;

  const descSection = filasDesc ? `
    <div class="recibo-section">
      <div class="recibo-section-title">Descuentos</div>
      ${filasDesc}
    </div>` : '';

  document.getElementById('recibo-container').innerHTML = `
    <div class="recibo-wrap">
      <div class="recibo-header">
        <strong>Recibo de Pago</strong>
        <span>Quincena del período ${periodoDisplay}</span>
      </div>

      <div class="recibo-section">
        <div class="recibo-section-title">Empleado</div>
        <div class="recibo-row">
          <span class="label">Nombre</span>
          <span class="value">${emp.nombre || '—'}</span>
        </div>
        <div class="recibo-row">
          <span class="label">Tipo de planilla</span>
          <span class="value">${emp.tipo_planilla || 'Con Seguro'}</span>
        </div>
        <div class="recibo-row">
          <span class="label">Salario mensual</span>
          <span class="value">${cs(salarioMensual)}</span>
        </div>
      </div>

      <div class="recibo-section">
        <div class="recibo-section-title">Ingresos</div>
        <div class="recibo-row subtotal">
          <span class="label">Salario quincenal</span>
          <span class="value">${cs(subTotalQuincena)}</span>
        </div>
      </div>

      ${extrasSection}
      ${descSection}

      <div class="recibo-row neto">
        <span class="label">Neto a recibir</span>
        <span class="value">${cs(netoAPagar)}</span>
      </div>

      <div class="firma-area" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          He recibido la suma de <strong>${cs(netoAPagar)}</strong> Córdobas Netos
          correspondiente a la quincena del período <strong>${periodoDisplay}</strong>.
          <div class="linea">Firma del empleado</div>
        </div>
        <div>
          <div class="linea">Quien entrega</div>
        </div>
      </div>
    </div>
  `;
}
// ── Descargar PDF ────────────────────────────────────────────────────────────
document.getElementById('btn-descargar-recibo').addEventListener('click', async () => {
  const p     = new URLSearchParams(window.location.search);
  const empId = p.get('empleado_id') || '';
  const per   = p.get('periodo') || '';
  const btn   = document.getElementById('btn-descargar-recibo');
  btn.disabled = true;
  btn.textContent = 'Generando...';
  try {
    const token     = getToken();
    const empresaId = localStorage.getItem('planilla_empresa_id');
    const headers   = {
      'Content-Type': 'application/json',
      ...(token     ? { Authorization: `Bearer ${token}` }       : {}),
      ...(empresaId ? { 'X-Empresa-ID': empresaId }              : {}),
    };
    const resp = await fetch(
      `/api/recibo/descargar?empleado_id=${encodeURIComponent(empId)}&periodo=${encodeURIComponent(per)}`,
      { headers }
    );
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }));
      throw new Error(err.error || 'Error al descargar');
    }
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `recibo-${per}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    btn.textContent = 'Descargado ✓';
    setTimeout(() => { btn.disabled = false; btn.textContent = '⬇ Descargar PDF'; }, 2000);
  } catch (e) {
    showAlert('alert-recibo', 'Error al descargar: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '⬇ Descargar PDF';
  }
});

// ── Modal enviar recibo por correo ───────────────────────────────────────────
document.getElementById('btn-email-recibo').addEventListener('click', () => {
  document.getElementById('alert-email-recibo').className = 'alert';
  document.getElementById('btn-send-recibo').disabled = false;
  document.getElementById('btn-send-recibo').textContent = 'Enviar PDF';
  document.getElementById('modal-email-recibo').classList.add('open');
  document.getElementById('inp-email-recibo').focus();
});

['close-email-recibo', 'cancel-email-recibo'].forEach(id =>
  document.getElementById(id).addEventListener('click', () =>
    document.getElementById('modal-email-recibo').classList.remove('open')
  )
);

document.getElementById('btn-send-recibo').addEventListener('click', async () => {
  const p      = new URLSearchParams(window.location.search);
  const empId  = p.get('empleado_id') || '';
  const per    = p.get('periodo') || '';
  const email  = document.getElementById('inp-email-recibo').value.trim();
  const alertEl = document.getElementById('alert-email-recibo');
  const btn    = document.getElementById('btn-send-recibo');
  if (!email) {
    alertEl.className = 'alert alert-error show';
    alertEl.textContent = 'Ingresa un correo destinatario';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Generando PDF...';
  alertEl.className = 'alert';
  try {
    const data = await apiFetch('/api/recibo/enviar', { method: 'POST', body: JSON.stringify({ email, empleado_id: empId, periodo: per }) });
    alertEl.className = 'alert alert-success show';
    alertEl.textContent = data.mensaje || 'Recibo enviado correctamente';
    btn.textContent = 'Enviado ✓';
  } catch (e) {
    alertEl.className = 'alert alert-error show';
    alertEl.textContent = e.message;
    btn.disabled = false;
    btn.textContent = 'Enviar PDF';
  }
});
</script>
</body>
</html>
