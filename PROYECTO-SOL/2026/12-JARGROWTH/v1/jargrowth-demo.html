<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JarGrowth animado</title>
<style>
  /* Página de prueba de jargrowth.js (28-oct): la marca como en la referencia, JarGrowth grande para
     ver los detalles y JarGrowth en la esquina como iría en el panel, con botones para forzar cada
     comportamiento sin esperar los minutos que tarda en salir solo. */
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EEF3FA; color: #063F67; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #fff; }
  header .icono { width: 40px; height: 40px; }
  header b { font-size: 20px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 160px; }
  .fila { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .grande { width: 260px; height: 260px; background: #fff; border-radius: 24px; }
  .botones { display: flex; flex-wrap: wrap; gap: 8px; max-width: 520px; }
  button { font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid #BBD3F2; background: #fff; color: #063F67; cursor: pointer; }
  button:hover { background: #E3F0FF; }
  p { line-height: 1.5; max-width: 640px; }
  .esquina { position: fixed; right: 24px; bottom: 24px; width: 110px; height: 110px; }
</style>
</head>
<body>
<header><div class="icono" id="icono"></div><b>Growth54</b></header>
<main>
  <p>JarGrowth late cada 1.6 a 2.6 s, mira para los lados, parpadea y cambia de emoción sola. Cada 2.5 a 4.5 min sale de paseo y cada 3 a 6 min se duerme. Los botones fuerzan cada cosa (mueven a las dos).</p>
  <div class="fila">
    <div class="grande" id="grande"></div>
    <div class="botones">
      <button data-a="paseo">Paseo</button>
      <button data-a="vuelta">Vuelta</button>
      <button data-a="siesta">Siesta</button>
      <button data-a="despertar">Despertar</button>
      <button data-a="feliz">Feliz</button>
      <button data-a="curioso">Curioso</button>
      <button data-a="sorpresa">Sorpresa</button>
      <button data-m="hablando">Hablando</button>
      <button data-m="pensando">Pensando</button>
      <button data-m="quieto">Quieto</button>
    </div>
  </div>
</main>
<div class="esquina" id="esquina"></div>
<script type="module">
  import { startJarGrowth } from "./jargrowth.js";
  startJarGrowth(document.getElementById("icono"), { fondo: true });
  const pulpos = [startJarGrowth(document.getElementById("grande")), startJarGrowth(document.getElementById("esquina"))];
  document.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    pulpos.forEach((j) => (b.dataset.a ? j.accion(b.dataset.a) : j.setMood(b.dataset.m)));
  }));
</script>
</body>
</html>
